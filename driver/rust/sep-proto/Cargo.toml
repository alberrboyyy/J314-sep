[package]
name = "sep-proto"
version = "0.1.0"
edition = "2021"
description = "AP<->SEP protocol (mailbox word, discovery, GT, xART, sensor frames) for the j314c Touch ID driver. Offline, emits nothing."
license = "GPL-2.0-or-later OR MIT"
publish = false

[features]
default = ["std"]
# std: offline reader for traces/ (sep.log + .ool). Implies alloc.
std = ["alloc"]
# alloc: the parts that need Vec / BTreeMap (tables, reassembly, vault, blob store). Without it the core is
# allocation-free and is what the kernel module embeds (the kernel has no `alloc` crate).
alloc = []

[dependencies]
